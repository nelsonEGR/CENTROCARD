name: centrocard

services:
  app:
    build: .
    image: centrocard:local
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      # production oculta el debug toolbar y los comentarios DEBUG-VIEW.
      # Usa development solo para depurar en local.
      CI_ENVIRONMENT: ${CI_ENVIRONMENT:-production}
      APP_BASE_URL: ${APP_BASE_URL:-http://centrocar.test/}
      DB_HOSTNAME: ${DB_HOSTNAME:-}
      DB_DATABASE: ${DB_DATABASE:-}
      DB_USERNAME: ${DB_USERNAME:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_PORT: ${DB_PORT:-5432}
      DB_SCHEMA: ${DB_SCHEMA:-public}
      DB_SSLMODE: ${DB_SSLMODE:-require}
      DB_OPTIONS: ${DB_OPTIONS:-}
      IMPUESTO: ${IMPUESTO:-10}
      GANANCIA: ${GANANCIA:-25}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
      PORT: "80"
    volumes:
      - writable_data:/var/www/html/writable
      - product_images:/var/www/html/public/img/productos

volumes:
  product_images:
  writable_data:
