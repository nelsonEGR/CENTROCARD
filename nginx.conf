# ============================================================
#  nginx para el proyecto CENTROCARD (independiente de Laragon)
#  Servidor: http://centrocar.test/  ->  127.0.0.1:80
#  PHP via FastCGI persistente (php-cgi) en 127.0.0.1:9000
# ============================================================

worker_processes  1;

error_log  C:/CENTROCARD/pos/writable/nginx-error.log warn;
pid        C:/CENTROCARD/pos/writable/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       C:/CENTROCARD/nginx/nginx-1.26.2/conf/mime.types;
    default_type  application/octet-stream;

    access_log    C:/CENTROCARD/pos/writable/nginx-access.log;
    sendfile      on;
    keepalive_timeout  65;
    client_max_body_size 64M;

    server {
        listen       127.0.0.1:80;
        server_name  centrocar.test;

        root   C:/CENTROCARD/pos/public;
        index  index.php;

        location / {
            try_files $uri $uri/ /index.php$is_args$args;
        }

        location ~ \.php(/|$) {
            fastcgi_split_path_info ^(.+?\.php)(/.*)$;
            fastcgi_pass   127.0.0.1:9000;
            fastcgi_index  index.php;
            fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param  PATH_INFO $fastcgi_path_info;
            include        C:/CENTROCARD/nginx/nginx-1.26.2/conf/fastcgi_params;
            fastcgi_read_timeout 300;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 7d;
            access_log off;
        }
    }
}
